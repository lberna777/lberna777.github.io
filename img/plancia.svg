    <rect x="48" y="228" width="212" height="56" rx="12" fill="#FBE9E6" stroke="#16161A" stroke-opacity=".06"/><rect x="48" y="240" width="3" height="32" fill="#7B5CF0"/>
    <circle cx="66" cy="246" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="82" y="250" font-weight="500">Laboratorio Java, es. 3</text><text x="82" y="270" font-size="11" fill="#D23F2A" font-weight="600">ieri</text>
    <rect x="48" y="292" width="212" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="48" y="304" width="3" height="32" fill="#7B5CF0"/>
    <circle cx="66" cy="310" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="82" y="314" font-weight="500">Lezione di Calcolatori</text><text x="82" y="334" font-size="11" fill="#B07A0C" font-weight="600">oggi</text>
    <rect x="48" y="356" width="212" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="48" y="368" width="3" height="32" fill="#2F7DE1"/>
    <circle cx="66" cy="374" r="7.5" fill="#2C8A57"/><path d="M62.5 374l2.5 2.5 4.5-5" stroke="#fff" stroke-width="1.8" fill="none"/>
    <text x="82" y="378" font-weight="500" fill="#7C7B82" text-decoration="line-through">Proposta a un cliente</text><text x="82" y="398" font-size="11" fill="#7C7B82">fatto</text>
    <!-- domani -->
    <rect x="296" y="228" width="212" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="296" y="240" width="3" height="32" fill="#7B5CF0"/>
    <circle cx="314" cy="246" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="330" y="250" font-weight="500">Ripasso dei moduli 1–2</text><text x="330" y="270" font-size="11" fill="#7C7B82">domani</text>
    <rect x="296" y="292" width="212" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="296" y="304" width="3" height="32" fill="#2F7DE1"/>
    <circle cx="314" cy="310" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="330" y="314" font-weight="500">Aggiornare il portfolio</text>
    <rect x="330" y="324" width="58" height="17" rx="8.5" fill="#3466D0" fill-opacity=".12"/><text x="337" y="336.5" font-size="10.5" fill="#3466D0">in corso</text>
    <!-- settimana -->
    <rect x="544" y="228" width="208" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="544" y="240" width="3" height="32" fill="#DE3F78"/>
    <circle cx="562" cy="246" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="578" y="250" font-weight="500">Mix del nuovo brano</text><text x="578" y="270" font-size="11" fill="#7C7B82">sab 17 ott</text>
    <rect x="544" y="292" width="208" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="544" y="304" width="3" height="32" fill="#7B5CF0"/>
    <circle cx="562" cy="310" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="578" y="314" font-weight="500">Simulazione d'esame</text><text x="578" y="334" font-size="11" fill="#7C7B82">dom 18 ott</text>
    <rect x="544" y="356" width="208" height="56" rx="12" fill="#fff" stroke="#16161A" stroke-opacity=".06"/><rect x="544" y="368" width="3" height="32" fill="#16958A"/>
    <circle cx="562" cy="374" r="7.5" fill="none" stroke="#16161A" stroke-opacity=".25" stroke-width="1.4"/>
    <text x="578" y="378" font-weight="500">Revisione dell'auto</text><text x="578" y="398" font-size="11" fill="#7C7B82">dom 18 ott</text>
  </g>
</svg>
